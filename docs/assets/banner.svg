<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">MOSS</title>
  <desc id="d">MOSS: Wikipedia and community pages over LoRa radio, with no internet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13241a"/>
      <stop offset="1" stop-color="#1f3d29"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#4f9a5c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f9a5c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#glow)"/>

  <g clip-path="url(#card)">
  <!-- a clump of moss, bottom left -->
  <g fill="#3f8a4c">
    <circle cx="70" cy="300" r="62"/>
    <circle cx="150" cy="292" r="48"/>
    <circle cx="225" cy="302" r="56"/>
    <circle cx="300" cy="306" r="40"/>
  </g>
  <g fill="#5fae69">
    <circle cx="95" cy="282" r="30"/>
    <circle cx="175" cy="270" r="26"/>
    <circle cx="245" cy="282" r="28"/>
    <circle cx="40" cy="268" r="20"/>
  </g>
  <!-- stalks with capsules -->
  <g stroke="#8fd096" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M110 262 C 112 225, 118 205, 128 185"/>
    <path d="M190 252 C 186 215, 192 190, 204 170"/>
    <path d="M250 264 C 256 238, 262 222, 272 206"/>
  </g>
  <g fill="#b7e4b9">
    <ellipse cx="130" cy="181" rx="7" ry="10" transform="rotate(25 130 181)"/>
    <ellipse cx="206" cy="166" rx="7" ry="10" transform="rotate(30 206 166)"/>
    <ellipse cx="274" cy="202" rx="6" ry="9" transform="rotate(35 274 202)"/>
  </g>
  <!-- spores drifting up and away, like data on the air -->
  <g fill="#cdeccf">
    <circle cx="150" cy="150" r="4" opacity="0.9"/>
    <circle cx="178" cy="122" r="3" opacity="0.8"/>
    <circle cx="226" cy="132" r="3.5" opacity="0.85"/>
    <circle cx="262" cy="98" r="3" opacity="0.7"/>
    <circle cx="300" cy="150" r="3" opacity="0.75"/>
    <circle cx="318" cy="112" r="2.5" opacity="0.6"/>
    <circle cx="352" cy="80" r="2.5" opacity="0.5"/>
    <circle cx="206" cy="78" r="2.5" opacity="0.55"/>
    <circle cx="390" cy="58" r="2" opacity="0.4"/>
  </g>
  <!-- radio waves -->
  <g stroke="#8fd096" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M330 190 a 40 40 0 0 1 0 -56"/>
    <path d="M314 202 a 60 60 0 0 1 0 -80"/>
  </g>

  </g>

  <!-- wordmark -->
  <text x="450" y="150" fill="#d8f2d9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="112" font-weight="800" letter-spacing="14">MOSS</text>
  <text x="454" y="200" fill="#a9d4ad" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="27" font-weight="500">Wikipedia and community pages over LoRa radio.</text>
  <text x="454" y="238" fill="#7fb486" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="22">No internet needed · private by default · kilometres of range</text>
</svg>
