<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">How MOSS works</title>
  <desc id="d">Your computer and a MeshCore radio send an encrypted request over LoRa radio, through repeaters if needed, to a Seed Vault: a Raspberry Pi with Wikipedia on a USB stick. The page comes back as numbered spores; missing ones are sent again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3f7a49"/>
    </marker>
  </defs>
  <style>
    .label { font: 700 24px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #18301e; }
    .sub   { font: 400 18px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5f50; }
    .note  { font: 500 17px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #2f6a39; }
    .tiny  { font: 600 13px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
  </style>
  <rect width="1200" height="470" rx="22" fill="#f4f8f3" stroke="#d3e3d2" stroke-width="2"/>

  <!-- ===== you: a laptop and a small radio ===== -->
  <g transform="translate(90 92)">
    <rect x="0" y="0" width="190" height="120" rx="10" fill="#26332a"/>
    <rect x="10" y="10" width="170" height="100" rx="4" fill="#dff0de"/>
    <rect x="22" y="22" width="60" height="8" rx="3" fill="#6aa874"/>
    <rect x="22" y="38" width="140" height="6" rx="3" fill="#a9c9ab"/>
    <rect x="22" y="50" width="120" height="6" rx="3" fill="#a9c9ab"/>
    <rect x="22" y="62" width="134" height="6" rx="3" fill="#a9c9ab"/>
    <rect x="22" y="80" width="12" height="12" rx="2" fill="#7d6ff0"/>
    <rect x="38" y="80" width="12" height="12" rx="2" fill="#7d6ff0"/>
    <rect x="54" y="80" width="12" height="12" rx="2" fill="#e8955e"/>
    <rect x="70" y="80" width="12" height="12" rx="2" fill="none" stroke="#9aa59c"/>
    <path d="M-18 128 h226 l-14 14 h-198 z" fill="#3a4a3e"/>
    <!-- radio -->
    <rect x="214" y="58" width="44" height="70" rx="9" fill="#e8955e"/>
    <rect x="223" y="70" width="26" height="18" rx="3" fill="#2d2a26"/>
    <line x1="250" y1="58" x2="262" y2="10" stroke="#3a4a3e" stroke-width="5" stroke-linecap="round"/>
    <path d="M200 100 q 8 -2 14 0" stroke="#3a4a3e" stroke-width="3" fill="none"/>
  </g>
  <text class="label" x="185" y="285" text-anchor="middle">You</text>
  <text class="sub" x="185" y="312" text-anchor="middle">a computer + a MeshCore radio</text>
  <text class="sub" x="185" y="336" text-anchor="middle">(USB cable or Bluetooth)</text>

  <!-- ===== the air, with a repeater ===== -->
  <g stroke="#6aa874" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M365 115 a 26 26 0 0 1 0 40"/><path d="M380 103 a 44 44 0 0 1 0 64"/>
    <path d="M835 115 a 26 26 0 0 0 0 40"/><path d="M820 103 a 44 44 0 0 0 0 64"/>
  </g>
  <g transform="translate(600 70)">
    <path d="M-34 160 L0 0 L34 160" fill="none" stroke="#3a4a3e" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-22 105 H22 M-14 60 H14" stroke="#3a4a3e" stroke-width="4"/>
    <circle cx="0" cy="0" r="9" fill="#e8955e"/>
    <g stroke="#6aa874" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M-22 -14 a 26 26 0 0 0 0 28"/><path d="M22 -14 a 26 26 0 0 1 0 28"/>
      <path d="M-36 -24 a 44 44 0 0 0 0 48"/><path d="M36 -24 a 44 44 0 0 1 0 48"/>
    </g>
  </g>
  <text class="label" x="600" y="285" text-anchor="middle">LoRa radio</text>
  <text class="sub" x="600" y="312" text-anchor="middle">kilometres of range, no internet,</text>
  <text class="sub" x="600" y="336" text-anchor="middle">through repeaters when needed</text>

  <!-- ===== the Seed Vault: a Raspberry Pi, a USB stick, a radio ===== -->
  <g transform="translate(905 100)">
    <rect x="0" y="0" width="170" height="112" rx="10" fill="#3f8a4c"/>
    <rect x="16" y="16" width="40" height="40" rx="4" fill="#26332a"/>
    <g fill="#d4a83a"><rect x="70" y="8" width="90" height="6" rx="2"/></g>
    <rect x="70" y="30" width="34" height="26" rx="3" fill="#cfd8d0"/>
    <rect x="112" y="30" width="34" height="26" rx="3" fill="#cfd8d0"/>
    <rect x="16" y="70" width="60" height="28" rx="3" fill="#cfd8d0"/>
    <!-- USB stick with Wikipedia -->
    <rect x="150" y="70" width="54" height="26" rx="5" fill="#26332a"/>
    <rect x="134" y="76" width="18" height="14" fill="#9aa59c"/>
    <text class="tiny" x="177" y="88" text-anchor="middle">W</text>
    <!-- radio -->
    <rect x="-56" y="28" width="40" height="64" rx="8" fill="#e8955e"/>
    <rect x="-48" y="40" width="24" height="16" rx="3" fill="#2d2a26"/>
    <line x1="-24" y1="28" x2="-14" y2="-14" stroke="#3a4a3e" stroke-width="5" stroke-linecap="round"/>
    <path d="M-16 74 q 8 -2 16 0" stroke="#3a4a3e" stroke-width="3" fill="none"/>
  </g>
  <text class="label" x="990" y="285" text-anchor="middle">Seed Vault</text>
  <text class="sub" x="990" y="312" text-anchor="middle">a Raspberry Pi with all of Wikipedia</text>
  <text class="sub" x="990" y="336" text-anchor="middle">on a USB stick, fully offline</text>

  <!-- ===== what travels ===== -->
  <path d="M190 380 H1000" stroke="#3f7a49" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="note" x="595" y="370" text-anchor="middle">your search, or the title you want (encrypted)</text>
  <path d="M1000 420 H190" stroke="#3f7a49" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <g transform="translate(560 410)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#7d6ff0"/>
    <rect x="22" y="0" width="16" height="16" rx="3" fill="#7d6ff0"/>
    <rect x="44" y="0" width="16" height="16" rx="3" fill="#e8955e"/>
    <rect x="66" y="0" width="16" height="16" rx="3" fill="#7d6ff0"/>
  </g>
  <text class="note" x="595" y="455" text-anchor="middle">the page, as numbered "spores"; any that get lost are simply sent again</text>
</svg>
