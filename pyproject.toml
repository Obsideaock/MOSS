[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "moss-mesh"
version = "0.6.0"
description = "MOSS: Wikipedia and community pages over MeshCore LoRa radios"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
moss = "moss.cli:main"

[tool.setuptools]
packages = ["moss"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
moss = ["index.html", "static/**/*"]
